name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          set +e
          output=$(go test ./... 2>&1)
          status=$?
          printf '```text\n%s\n```\n' "$output" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$output"
          exit "$status"
