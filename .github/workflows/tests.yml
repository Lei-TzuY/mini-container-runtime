name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/go-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Report test failure
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Diagnostic `go test ./...` output:'
            echo '```text'
            cat /tmp/go-test.log
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment.md
      - name: Fail test job
        if: steps.test.outcome == 'failure'
        run: exit 1
