name: Apply events CLI query wiring

on:
  push:
    branches:
      - feat/events-cli-query

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply focused change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cmd/minictl/main.go')
          text = path.read_text()
          old_usage = '  minictl events  [-f]                                        Stream real-time container events\n'
          new_usage = '  minictl events  [-f|--follow] [--json] [--container prefix] [--type type]  Query lifecycle events\n'
          if old_usage not in text:
              raise SystemExit('events usage line not found')
          text = text.replace(old_usage, new_usage, 1)

          old = '''func cmdEvents(args []string) {
          \tfs := flag.NewFlagSet("events", flag.ExitOnError)
          \tfollow := fs.Bool("f", false, "follow real-time event log")
          \t_ = fs.Bool("follow", false, "follow log output")
          \tfs.SetOutput(os.Stderr)
          \t_ = fs.Parse(args)

          \tif err := events.StreamEvents(*follow, os.Stdout); err != nil {
          \t\tfmt.Fprintf(os.Stderr, "events error: %v\\n", err)
          \t\tos.Exit(1)
          \t}
          }
          '''
          new = '''func cmdEvents(args []string) {
          \topts, err := parseEventsCLIOptions(args, os.Stderr)
          \tif err != nil {
          \t\tfmt.Fprintf(os.Stderr, "events error: %v\\n", err)
          \t\tos.Exit(1)
          \t}

          \tif err := events.StreamEventsWithOptions(opts, os.Stdout); err != nil {
          \t\tfmt.Fprintf(os.Stderr, "events error: %v\\n", err)
          \t\tos.Exit(1)
          \t}
          }
          '''
          if old not in text:
              raise SystemExit('cmdEvents block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > cmd/minictl/events_cli.go <<'EOF'
          package main

          import (
          	"flag"
          	"fmt"
          	"io"
          	"strings"

          	"minicontainer/internal/events"
          )

          type eventTypeFlag []events.EventType

          func (values *eventTypeFlag) String() string {
          	if values == nil || len(*values) == 0 {
          		return ""
          	}
          	parts := make([]string, 0, len(*values))
          	for _, value := range *values {
          		parts = append(parts, string(value))
          	}
          	return strings.Join(parts, ",")
          }

          func (values *eventTypeFlag) Set(value string) error {
          	value = strings.TrimSpace(value)
          	if value == "" {
          		return fmt.Errorf("event type must not be empty")
          	}
          	*values = append(*values, events.EventType(value))
          	return nil
          }

          func parseEventsCLIOptions(args []string, stderr io.Writer) (events.StreamOptions, error) {
          	fs := flag.NewFlagSet("events", flag.ContinueOnError)
          	fs.SetOutput(stderr)

          	var opts events.StreamOptions
          	var types eventTypeFlag
          	fs.BoolVar(&opts.Follow, "f", false, "follow real-time event log")
          	fs.BoolVar(&opts.Follow, "follow", false, "follow real-time event log")
          	fs.BoolVar(&opts.JSON, "json", false, "emit one JSON event per line")
          	fs.StringVar(&opts.ContainerPrefix, "container", "", "filter by container ID prefix")
          	fs.Var(&types, "type", "filter by lifecycle event type (repeatable)")

          	if err := fs.Parse(args); err != nil {
          		return events.StreamOptions{}, err
          	}
          	if fs.NArg() != 0 {
          		return events.StreamOptions{}, fmt.Errorf("unexpected positional argument %q", fs.Arg(0))
          	}
          	opts.Types = append([]events.EventType(nil), types...)
          	return opts, nil
          }
          EOF

          cat > cmd/minictl/events_cli_test.go <<'EOF'
          package main

          import (
          	"bytes"
          	"reflect"
          	"strings"
          	"testing"

          	"minicontainer/internal/events"
          )

          func TestParseEventsCLIOptionsFollowAliases(t *testing.T) {
          	for _, flagName := range []string{"-f", "--follow"} {
          		t.Run(flagName, func(t *testing.T) {
          			opts, err := parseEventsCLIOptions([]string{flagName}, &bytes.Buffer{})
          			if err != nil {
          				t.Fatalf("parse: %v", err)
          			}
          			if !opts.Follow {
          				t.Fatalf("Follow = false for %s", flagName)
          			}
          		})
          	}
          }

          func TestParseEventsCLIOptionsQuery(t *testing.T) {
          	opts, err := parseEventsCLIOptions([]string{
          		"--json",
          		"--container", "deadbeef",
          		"--type", "start",
          		"--type=die",
          	}, &bytes.Buffer{})
          	if err != nil {
          		t.Fatalf("parse: %v", err)
          	}
          	if !opts.JSON {
          		t.Fatal("JSON = false")
          	}
          	if opts.ContainerPrefix != "deadbeef" {
          		t.Fatalf("ContainerPrefix = %q", opts.ContainerPrefix)
          	}
          	wantTypes := []events.EventType{events.EventStart, events.EventDie}
          	if !reflect.DeepEqual(opts.Types, wantTypes) {
          		t.Fatalf("Types = %#v, want %#v", opts.Types, wantTypes)
          	}
          }

          func TestParseEventsCLIOptionsRejectsEmptyType(t *testing.T) {
          	var stderr bytes.Buffer
          	_, err := parseEventsCLIOptions([]string{"--type", "   "}, &stderr)
          	if err == nil || !strings.Contains(err.Error(), "must not be empty") {
          		t.Fatalf("err = %v, stderr = %q", err, stderr.String())
          	}
          }

          func TestParseEventsCLIOptionsRejectsTrailingArguments(t *testing.T) {
          	_, err := parseEventsCLIOptions([]string{"--json", "unexpected"}, &bytes.Buffer{})
          	if err == nil || !strings.Contains(err.Error(), "unexpected positional argument") {
          		t.Fatalf("err = %v", err)
          	}
          }

          func TestParseEventsCLIOptionsRejectsUnknownFlag(t *testing.T) {
          	_, err := parseEventsCLIOptions([]string{"--jsno"}, &bytes.Buffer{})
          	if err == nil {
          		t.Fatal("expected unknown flag error")
          	}
          }
          EOF

          gofmt -w cmd/minictl/main.go cmd/minictl/events_cli.go cmd/minictl/events_cli_test.go
          go vet ./...
          go test ./...
          rm .github/workflows/apply-events-cli.yml

      - name: Commit focused change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/minictl/main.go cmd/minictl/events_cli.go cmd/minictl/events_cli_test.go .github/workflows/apply-events-cli.yml
          git commit -m "feat(events): expose lifecycle query options in CLI"
          git push origin HEAD:feat/events-cli-query
