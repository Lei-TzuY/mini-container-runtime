name: BIL-71 CLI completion

on:
  push:
    branches:
      - automation/bil-71-cli-default-command

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation helpers
        uses: actions/checkout@v4
        with:
          path: automation
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: conquest/bil-71-image-command
          fetch-depth: 0
          path: source
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "51ca349c269828cdbc042bdc8063128b9ed0ea56"
          remote_head="$(git ls-remote origin refs/heads/conquest/bil-71-image-command | awk '{print $1}')"
          test "$remote_head" = "51ca349c269828cdbc042bdc8063128b9ed0ea56"
      - name: Complete rootfs-only CLI admission
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/.github/automation/bil71_cli.py source
          gofmt -w source/cmd/minictl/main.go source/cmd/minictl/main_test.go source/cmd/minictl/run_image_command_test.go
          git -C source diff --check
      - name: Vet
        working-directory: source
        run: go vet ./...
      - name: Test
        working-directory: source
        run: go test ./...
      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          remote_head="$(git ls-remote origin refs/heads/conquest/bil-71-image-command | awk '{print $1}')"
          test "$remote_head" = "51ca349c269828cdbc042bdc8063128b9ed0ea56"
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add cmd/minictl/main.go cmd/minictl/main_test.go cmd/minictl/run_image_command_test.go
          git diff --cached --check
          git commit -m "feat(run): allow OCI image command defaults from CLI"
          git push origin HEAD:conquest/bil-71-image-command
